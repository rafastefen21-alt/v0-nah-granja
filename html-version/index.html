<script>
  // Nav scroll
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => nav.classList.toggle('solid', window.scrollY > 60));

  // Carrossel
  const CS = {};
  function initC(id) {
    const num = id.replace('carousel','');
    const track = document.getElementById('track'+num);
    const slides = Array.from(track.querySelectorAll('.carousel-slide'));
    const dotsEl = document.getElementById('dots'+num);
    const total = slides.length;
    let cur = 0, timer;

    function getPerPage(){ return window.innerWidth <= 900 ? 1 : 3; }
    function getPages(){ return Math.ceil(total / getPerPage()); }

    function buildDots(){
      dotsEl.innerHTML = '';
      for(let i=0;i<getPages();i++){
        const d = document.createElement('button');
        d.className = 'c-dot'+(i===cur?' on':'');
        d.onclick = () => go(i);
        dotsEl.appendChild(d);
      }
    }

    function go(page){
      const pages = getPages(), perPage = getPerPage();
      cur = (page + pages) % pages;
      const slideW = slides[0].offsetWidth;
      const gap = window.innerWidth <= 900 ? 0 : 16;
      track.style.transform = 'translateX(-'+(cur*perPage*(slideW+gap))+'px)';
      dotsEl.querySelectorAll('.c-dot').forEach((d,i) => d.classList.toggle('on', i===cur));
    }

    function start(){ timer = setInterval(() => go(cur+1), 4500); }
    function stop(){ clearInterval(timer); }

    document.getElementById(id).addEventListener('mouseenter', stop);
    document.getElementById(id).addEventListener('mouseleave', start);
    window.addEventListener('resize', () => { cur=0; buildDots(); go(0); });

    buildDots();
    CS[id] = { go, getPage: () => cur };
    start();
  }

  function moveC(id, dir){
    const pages = document.getElementById('dots'+id.replace('carousel','')).children.length;
    CS[id].go(CS[id].getPage() + dir);
  }
  initC('carousel1');
  initC('carousel2');

  // Zoom planta
  function navigateWithZoom(e, url){
    e.preventDefault();
    const c = document.getElementById('plantaContainer');
    c.classList.add('zoom-in');
    setTimeout(() => { window.location.href = url; }, 600);
  }

  // Crossfade pitangueiras
  (function(){
    let cur = 0;
    setInterval(function(){
      const imgs = document.querySelectorAll('#pitCrossfade .crossfade');
      imgs[cur].classList.remove('visible'); imgs[cur].classList.add('hidden');
      cur = (cur+1) % imgs.length;
      imgs[cur].classList.remove('hidden'); imgs[cur].classList.add('visible');
    }, 2000);
  })();

  // Mobile menu
  function toggleMobileMenu(){
    document.getElementById('hamburger').classList.toggle('open');
    document.getElementById('mobileMenu').classList.toggle('open');
    document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('open') ? 'hidden' : '';
  }
  function closeMobileMenu(){
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('mobileMenu').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Dados do form
  function getFormData(){
    const dataRaw = document.getElementById('data').value;
    const dataFormatada = dataRaw ? new Date(dataRaw+'T00:00:00').toLocaleDateString('pt-BR') : '';
    return {
      nome: document.getElementById('nome').value,
      empresa: document.getElementById('empresa').value,
      email: document.getElementById('email').value,
      telefone: document.getElementById('telefone').value,
      tipo: document.getElementById('tipo').value,
      pessoas: document.getElementById('pessoas').value,
      data: dataFormatada,
      horarioInicio: document.getElementById('horario-inicio').value,
      horarioTermino: document.getElementById('horario-termino').value
    };
  }

  // ✅ WhatsApp — com GTM push e mensagem completa
  function enviarWhatsApp(e){
    e.preventDefault();
    const d = getFormData();

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: 'lead_whatsapp',
      lead_nome: d.nome,
      lead_tipo: d.tipo
    });

    const msg = `Olá! Gostaria de solicitar um orçamento para evento no Nah Granja.\n\n*Nome:* ${d.nome}\n*Empresa:* ${d.empresa||'Não informado'}\n*E-mail:* ${d.email}\n*Telefone:* ${d.telefone}\n*Tipo de Evento:* ${d.tipo}\n*Quantidade de Pessoas:* ${d.pessoas}\n*Data do Evento:* ${d.data}\n*Horário de Início:* ${d.horarioInicio}\n*Horário de Término:* ${d.horarioTermino}`;
    window.open('https://wa.me/5511940439119?text='+encodeURIComponent(msg), '_blank');
  }

  // ✅ PHP (AJAX) — com GTM push — chamado pelo botão "Enviar por E-mail"
  function enviarPHP(){
    const form = document.getElementById('contactForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const d = getFormData();
    const msgEl = document.getElementById('form-msg');
    const btn = document.querySelector('.form-email');

    btn.textContent = 'Enviando...';
    btn.disabled = true;

    const fd = new FormData();
    Object.keys(d).forEach(k => fd.append(k, d[k]));

    fetch('contato.php', { method:'POST', body: fd })
      .then(r => r.json())
      .then(res => {
        // GTM push só em caso de sucesso
        if(res.ok){
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'lead_email',
            lead_nome: d.nome,
            lead_tipo: d.tipo
          });
          form.reset();
        }
        msgEl.style.display = 'block';
        msgEl.style.background = res.ok ? '#e8f5e9' : '#ffebee';
        msgEl.style.color = res.ok ? '#2e7d32' : '#c62828';
        msgEl.textContent = res.mensagem;
        btn.textContent = 'Enviar por E-mail';
        btn.disabled = false;
      })
      .catch(() => {
        msgEl.style.display = 'block';
        msgEl.style.background = '#ffebee';
        msgEl.style.color = '#c62828';
        msgEl.textContent = 'Erro ao enviar. Tente pelo WhatsApp.';
        btn.textContent = 'Enviar por E-mail';
        btn.disabled = false;
      });
  }

  // Reveal
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(el => io.observe(el));
</script>
